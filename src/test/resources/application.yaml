# CPT scenarios drive every job manually (COMPLETE_JOB / THROW_BPMN_ERROR_FROM_JOB),
# so the real @JobWorker beans must not race the test for the same jobs.
camunda:
  client:
    worker:
      defaults:
        enabled: false

# CPT scenarios correlate the disbursement-confirmation message directly
# (CORRELATE_MESSAGE), so no real Kafka broker is needed - disable the
# CoreBankingKafkaSimulator bean entirely for tests (KafkaAutoConfiguration
# itself must stay enabled so unrelated auto-configured beans still resolve).
core-banking-simulator:
  enabled: false
