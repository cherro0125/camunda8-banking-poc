# Overlay for the lightweight docker-compose.yaml that swaps the no-auth Orchestration
# config for a real OIDC-secured one, backed by a standalone dev-mode Keycloak (no
# Postgres/Identity needed - see README for why we didn't use docker-compose-full.yaml's
# Keycloak+Identity+Postgres+Elasticsearch stack).
#
# Usage:
#   ORCHESTRATION_CONFIG_FILE=application-h2-oauth.yaml \
#     docker compose -f docker-compose.yaml -f docker-compose.oauth.yaml up -d
#
# Then run setup is NOT needed here - clients are declared directly in keycloak-realm.json
# and imported automatically on Keycloak startup (--import-realm).
services:
  keycloak:
    image: camunda/keycloak:${KEYCLOAK_SERVER_VERSION:-quay-26.6.4}
    container_name: keycloak
    command: ["start-dev", "--http-port=18080", "--import-realm"]
    ports:
      - "18080:18080"
    volumes:
      - "./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/18080 && echo -e 'GET /realms/camunda-platform HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - camunda

  orchestration:
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - camunda
